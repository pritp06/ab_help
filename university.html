<!DOCTYPE html>

    <title>University Overview — StudyBuddy</title>
    <script>
        (function() {
            const saved = localStorage.getItem('study_abroad_theme');

            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">

    <link rel="stylesheet" href="css/typography.css">

    <main class="section">
        <div class="container">
            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-small text-muted" style="margin-bottom: var(--space-6);">
                <a href="/" class="hover-link">Home</a>
                <span>/</span>
                <a href="universities.html" class="hover-link">Top Universities</a>
                <span>/</span>
