<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — StudyBuddy</title>
    <script>
        (function() {
            const saved = localStorage.getItem('study_abroad_theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="auth">
    <div id="navbar-mount"></div>

    <main class="section flex justify-center items-center">
        <div class="card" style="width: 100%; max-width: 420px; padding: var(--space-8);">
            <div class="text-center" style="margin-bottom: var(--space-6);">
                <h1 class="text-h2">Reset Password</h1>
                <p class="text-small text-secondary" style="margin-top: 4px;">Enter your email to receive a password reset link.</p>
            </div>

            <form class="flex flex-col gap-4" id="forgot-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="input" required placeholder="student@example.com" />
                </div>

                <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
            </form>

            <div class="text-center text-small text-secondary" style="margin-top: var(--space-6);">
                Remembered your password? <a href="login.html" class="text-semibold hover-link">Back to Sign In</a>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
