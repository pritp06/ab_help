<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Planner Workspace — StudyBuddy</title>
    <script>
        (function() {
            const saved = localStorage.getItem('study_abroad_theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="planner">
    <div id="navbar-mount"></div>

    <main class="section">
        <div class="container">
            <div class="flex justify-between items-center" style="margin-bottom: var(--space-8);">
                <div>
                    <h1 class="text-h1">Application Planner Workspace</h1>
                    <p class="text-large text-secondary" style="margin-top: var(--space-2);">
                        Track application stages, deadline countdowns, and document submission checklists.
                    </p>
                </div>
                <a href="courses.html" class="btn btn-secondary btn-sm">+ Add Program from Courses</a>
            </div>

            <!-- Planner Board Mount -->
            <div id="planner-board-mount"></div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
