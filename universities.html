<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QS Top 250 Universities 2026 — StudyBuddy</title>
    <script>
        (function() {
            const saved = localStorage.getItem('study_abroad_theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="universities">
    <div id="navbar-mount"></div>

    <main class="section">
        <div class="container">
            <!-- Header Section -->
            <div style="margin-bottom: var(--space-8);">
                <div class="flex items-center gap-3" style="margin-bottom: var(--space-2);">
                    <span class="badge badge-accent">QS World University Rankings 2026</span>
                </div>
                <h1 class="text-h1">Top Universities</h1>
                <p class="text-large text-secondary" style="margin-top: var(--space-2); max-width: 800px;">
                    Explore leading universities worldwide based on the official QS World University Rankings 2026 dataset.
                </p>
            </div>

            <!-- Controls & Filters Bar -->
            <div class="card card-body" style="margin-bottom: var(--space-6);">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                    <!-- Search Input -->
                    <div class="md:col-span-8">
                        <div class="input-icon-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="text" class="input" id="qs-2026-search-input" placeholder="Search universities by name..." />
                        </div>
                    </div>

                    <!-- Rank Range Filter Buttons -->
                    <div class="md:col-span-4 flex items-center justify-end gap-2 flex-wrap">
                        <button class="btn btn-sm btn-ghost qs-2026-range-btn" data-rank="10">Top 10</button>
                        <button class="btn btn-sm btn-ghost qs-2026-range-btn" data-rank="50">Top 50</button>
                        <button class="btn btn-sm btn-ghost qs-2026-range-btn" data-rank="100">Top 100</button>
                        <button class="btn btn-sm btn-ghost qs-2026-range-btn" data-rank="200">Top 200</button>
                        <button class="btn btn-sm btn-primary qs-2026-range-btn" data-rank="250">Top 250</button>
                    </div>
                </div>
            </div>

            <!-- Editorial Ranking List Container -->
            <div id="qs-2026-rankings-mount"></div>

            <!-- Source & Disclaimer -->
            <div class="card card-body text-caption text-secondary" style="margin-top: var(--space-8); background-color: var(--color-surface-hover);">
                <p>
                    <strong>Ranking source:</strong> QS World University Rankings 2026. Rankings are one factor to consider when researching universities.
                </p>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
