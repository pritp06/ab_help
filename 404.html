<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found — StudyBuddy</title>
    <script>
        (function() {
            const saved = localStorage.getItem('study_abroad_theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="404">
    <div id="navbar-mount"></div>

    <main class="section flex justify-center items-center">
        <div class="card text-center" style="width: 100%; max-width: 480px; padding: var(--space-12);">
            <div class="badge badge-error" style="margin-bottom: var(--space-4);">Error 404</div>
            <h1 class="text-h1" style="margin-bottom: var(--space-2);">Page Not Found</h1>
            <p class="text-large text-secondary" style="margin-bottom: var(--space-8);">
                The university, course, or page you are looking for does not exist or has been moved.
            </p>

            <div class="flex justify-center gap-4">
                <a href="/" class="btn btn-primary">Return Home</a>
                <a href="courses.html" class="btn btn-secondary">Browse Courses</a>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
