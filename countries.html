<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Destinations — Countries — StudyBuddy</title>
    <script>
        (function() {
            const saved = localStorage.getItem('study_abroad_theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="countries">
    <div id="navbar-mount"></div>

    <main class="section">
        <div class="container">
            <div class="flex justify-between items-end" style="margin-bottom: var(--space-8);">
                <div>
                    <h1 class="text-h1">Explore Study Destinations</h1>
                    <p class="text-large text-secondary" style="margin-top: var(--space-2);">
                        Compare tuition policy, living expenses, and post-study visa rights across top study abroad countries.
                    </p>
                </div>

                <div class="flex items-center gap-2">
                    <button class="btn btn-primary btn-sm" data-region="all">All Regions</button>
                    <button class="btn btn-ghost btn-sm" data-region="Europe">Europe</button>
                    <button class="btn btn-ghost btn-sm" data-region="North America">North America</button>
                    <button class="btn btn-ghost btn-sm" data-region="Oceania">Oceania</button>
                </div>
            </div>

            <div class="grid grid-auto-fit-cards" id="countries-grid"></div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
